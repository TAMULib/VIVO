version: '3.2'

networks:
  net:

services:

  solr:
    image: vivoweb/vivo-solr:latest
    hostname: solr
    environment:
      - RESET_CORE=${RESET_CORE}
      - VERBOSE=${VERBOSE}
    ports:
      - 8983:8983
    volumes:
      - ${LOCAL_SOLR_DATA}:/opt/solr/server/solr/mycores
    networks:
      - net

  tomcat:
    container_name: vivo
    hostname: vivo
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        - SOLR_URL=http://solr:8983/solr/vivocore
        - VIVO_DIR=/usr/local/vivo/home
        - TDB_FILE_MODE=direct
        - VITRO_BRANCH=https://github.com/vivo-project/Vitro.git
        - VIVO_BRANCH=https://github.com/vivo-project/VIVO.git
        - VITRO_BRANCH=i18n-redesign
        - VIVO_BRANCH=i18n-redesign
        - BASE_PATH=ROOT
    environment:
      - RESET_HOME=${RESET_HOME}
      - VERBOSE=${VERBOSE}
    ports:
      - 8080:8080
    volumes:
      - ${LOCAL_VIVO_HOME}:/usr/local/vivo/home
    depends_on:
      - solr
    networks:
      - net
